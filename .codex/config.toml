# プロジェクト単位の Codex 設定（このリポジトリを信頼済みにしている場合に読み込まれる）。

# 担当役の待機（wait_agent）は、短い時間を指定されても最大の1時間まで待つ。
# Task 2107 では窓口が60秒の待機を52回、Task 2122 では20回繰り返し、そのたびに窓口の文脈全体を送り直した。
# 待機は担当役の完了とユーザーの発言で終わるので、長く待っても応答は遅れない。
# wait_agent はフック（PreToolUse）の対象外で、フックでは止められない。
[features.multi_agent_v2]
min_wait_timeout_ms = 3600000
default_wait_timeout_ms = 3600000
